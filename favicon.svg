<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="islandGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <radialGradient id="sunGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="70%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </radialGradient>
  </defs>

  <!-- 圆角背景 -->
  <rect x="0" y="0" width="64" height="64" rx="14" ry="14" fill="url(#bgGrad)"/>

  <!-- 太阳 -->
  <circle cx="44" cy="20" r="7" fill="url(#sunGrad)"/>

  <!-- 海水/水面 -->
  <ellipse cx="32" cy="46" rx="24" ry="9" fill="url(#waterGrad)"/>
  <path d="M 8 46 Q 14 43, 20 46 T 32 46 T 44 46 T 56 46 L 56 50 Q 50 52, 44 50 T 32 50 T 20 50 T 8 50 Z" fill="#1d4ed8" opacity="0.7"/>

  <!-- 岛屿 -->
  <ellipse cx="32" cy="44" rx="16" ry="5" fill="url(#islandGrad)"/>
  <path d="M 16 44 Q 22 36, 32 35 Q 42 36, 48 44 Z" fill="#84cc16" opacity="0.95"/>
  <path d="M 18 44 Q 24 38, 32 37 Q 40 38, 46 44 Z" fill="#65a30d" opacity="0.85"/>

  <!-- 椰子树 -->
  <rect x="30" y="20" width="2.5" height="16" fill="#78350f" rx="1"/>
  <!-- 树叶 -->
  <path d="M 31 20 Q 24 16, 20 18 Q 24 20, 28 22 Z" fill="#16a34a"/>
  <path d="M 31 20 Q 38 16, 42 18 Q 38 20, 34 22 Z" fill="#16a34a"/>
  <path d="M 31 20 Q 26 14, 30 10 Q 32 14, 32 19 Z" fill="#22c55e"/>
  <path d="M 31 20 Q 36 14, 32 10 Q 32 14, 32 19 Z" fill="#22c55e"/>
  <!-- 椰子 -->
  <circle cx="31.2" cy="21" r="1.5" fill="#78350f"/>
</svg>
